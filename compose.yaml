services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kitchen_almanac
      POSTGRES_USER: kitchen_almanac
      POSTGRES_PASSWORD: kitchen_almanac_dev
    ports:
      - "5432:5432"
    volumes:
      - kitchen-almanac-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen_almanac"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kitchen-almanac-postgres:
