[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitchen-almanac"
version = "0.1.0"
description = "Location-aware garden planning API and data tools"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "rasterio>=1.4,<2",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
kitchen-almanac = "kitchen_almanac.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kitchen_almanac"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
